name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native: ${{ steps.select.outputs.native }}
      lint: ${{ steps.select.outputs.lint }}
      msrv: ${{ steps.select.outputs.msrv }}
      stable: ${{ steps.select.outputs.stable }}
      examples_enabled: ${{ steps.select.outputs.examples_enabled }}
      examples: ${{ steps.select.outputs.examples }}
      nix_full: ${{ steps.select.outputs.nix_full }}
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI control logic
        run: python3 -B -m unittest discover -s scripts -p test_check.py
      - name: Check workflow
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/tools.toml", "rb"))["actionlint"])')
          archive="actionlint_${version}_linux_amd64.tar.gz"
          checksums="actionlint_${version}_checksums.txt"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -O "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          curl --fail --location --retry 3 -O "https://github.com/rhysd/actionlint/releases/download/v${version}/${checksums}"
          grep "  ${archive}$" "$checksums" | sha256sum --check -
          tar -xzf "$archive" actionlint
          ./actionlint --version
          ./actionlint -shellcheck='' "$GITHUB_WORKSPACE/.github/workflows/rust.yml"
      - run: python3 scripts/check.py run preflight
      - id: select
        name: Select checks
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check.py select --event "$CI_EVENT" --base "$CI_BASE" --head "$CI_HEAD"

  native:
    needs: preflight
    if: needs.preflight.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install and select pinned Rust
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$toolchain"
          rustc --version
          cargo --version
      - run: python3 scripts/check.py run native

  lint:
    needs: preflight
    if: needs.preflight.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install and select pinned Rust
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$toolchain"
          rustc --version
          cargo --version
      - run: python3 scripts/check.py run fmt
      - run: python3 scripts/check.py run clippy

  msrv:
    needs: preflight
    if: needs.preflight.outputs.msrv == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install and select pinned Rust
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$toolchain"
          rustc --version
          cargo --version
      - run: python3 scripts/check.py run msrv

  stable:
    needs: preflight
    if: needs.preflight.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install and select latest stable Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          rustc --version
          cargo --version
      - run: python3 scripts/check.py run stable

  examples:
    needs: preflight
    if: needs.preflight.outputs.examples_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.examples) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install and select pinned Rust
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default "$toolchain"
          rustc --version
          cargo --version
      - name: Install fixed build tools
        run: |
          mapfile -t versions < <(python3 -c 'import tomllib; t=tomllib.load(open("ci/tools.toml", "rb")); print("\n".join(t[k] for k in ("cargo-binstall", "wasm-bindgen", "dioxus-cli", "trunk")))')
          curl --fail --location --retry 3 "https://github.com/cargo-bins/cargo-binstall/releases/download/v${versions[0]}/cargo-binstall-x86_64-unknown-linux-musl.tgz" -o "$RUNNER_TEMP/binstall.tgz"
          tar -xzf "$RUNNER_TEMP/binstall.tgz" -C "$RUNNER_TEMP" cargo-binstall
          install "$RUNNER_TEMP/cargo-binstall" "$HOME/.cargo/bin/cargo-binstall"
          cargo binstall -V
          cargo binstall --locked --no-confirm "wasm-bindgen-cli@${versions[1]}" "dioxus-cli@${versions[2]}" "trunk@${versions[3]}"
      - name: Install desktop libraries
        if: matrix.name == 'dioxus-desktop-demo'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build example
        env:
          EXAMPLE_NAME: ${{ matrix.name }}
        run: python3 scripts/check.py run example "$EXAMPLE_NAME"

  nix:
    needs: preflight
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@8887e596b4ee1134dae06b98d573bd674693f47c # v26
      - uses: cachix/cachix-action@18cf96c7c98e048e10a83abd92116114cd8504be # v14
        with:
          name: devenv
          skipPush: true
      - name: Check Nix environment
        env:
          NIX_FULL: ${{ needs.preflight.outputs.nix_full }}
        run: |
          if [ "$NIX_FULL" = false ]; then
            python3 scripts/check.py run nix-smoke
          else
            python3 scripts/check.py run nix-full
          fi

  ci-gate:
    needs: [preflight, native, lint, msrv, stable, examples, nix]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require selected checks to succeed
        env:
          CI_SELECTION_JSON: ${{ needs.preflight.outputs.selection }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check.py gate
